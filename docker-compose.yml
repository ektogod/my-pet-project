version: "3.9"

services:
  redis:
    image: redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
  mysql:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'my_db'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: '1234'
      MYSQL_ROOT_PASSWORD: 'qwerty'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - mysql:/var/lib/mysql
  flyway:
    image: flyway/flyway:latest
    command: -url=jdbc:mysql://mysql:3306/my_db?allowPublicKeyRetrieval=true -user=user -password=1234 -locations=filesystem:/flyway/sql migrate
    volumes:
      - ./flyway/sql:/flyway/sql
    depends_on:
      - mysql

volumes:
  redis-data: { }
  mysql: { }